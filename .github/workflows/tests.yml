name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vi_user
          POSTGRES_PASSWORD: vi_test_pass
          POSTGRES_DB: vi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vi_user:vi_test_pass@localhost:5432/vi_db
      JWT_SECRET: e2e_test_secret_key_not_for_production
      PORT: 3002
      ADMIN_EMAIL: e2e-admin@example.com
      SEED_ADMIN_EMAIL: e2e-admin@example.com
      SEED_ADMIN_PASSWORD: e2e_admin_pass_123
      SEED_TEST_EMAIL: e2e-test@example.com
      SEED_TEST_PASSWORD: e2e_test_pass_123
      VITE_ADMIN_EMAIL: e2e-admin@example.com
      VITE_API_PROXY_TARGET: http://localhost:3002

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Instalar dependencias backend
        run: npm ci
        working-directory: server

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Cargar schema de la base de datos
        run: psql "$DATABASE_URL" -f server/schema.sql

      - name: Sembrar datos de prueba
        run: node seed.js
        working-directory: server

      - name: Levantar el backend
        run: |
          nohup node index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3002/health && break; sleep 1; done
        working-directory: server

      - name: Levantar el frontend
        run: |
          nohup npm run dev -- --port 5173 --strictPort > frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/vi/ && break; sleep 1; done

      - name: Correr tests E2E
        run: npm run test:e2e

      - name: Subir reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            server/server.log
            frontend.log
          retention-days: 7
